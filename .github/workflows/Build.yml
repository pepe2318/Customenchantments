
name: Build Custom Enchantments

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Extract project
        run: |
          unzip -o CustomEnchantments-GitHub-upload.zip -d project

      - name: Build mod
        run: |
          gradle -p project/CustomEnchantments-1.21.10 build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomEnchantments
          path: project/CustomEnchantments-1.21.10/build/libs/*.jar
